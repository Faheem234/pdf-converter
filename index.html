<body>

<div class="container">

    <h1 id="pdf">PDF Converter</h1>

    <!-- TEXT -->
    <label class="label" for="content">
        Enter Text
    </label>

    <textarea
        id="content"
        placeholder="Enter your text here..."
    ></textarea>


    <!-- IMAGE UPLOAD -->
    <label class="label">
        Add Images
    </label>

    <label class="upload-box">

        <input
            type="file"
            id="imageInput"
            accept="image/*"
            multiple
        >

        <div class="upload-text">
            📷 Click to upload images
        </div>

        <div class="info">
            You can select multiple JPG, PNG or WebP images
        </div>

    </label>


    <!-- IMAGE PREVIEW -->
    <div id="preview"></div>


    <!-- DOWNLOAD -->
    <button
        class="download"
        onclick="generatePDF()"
    >
        Download PDF
    </button>

</div>


<script>

    const { jsPDF } = window.jspdf;

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");

    let images = [];


    // Handle image selection
    imageInput.addEventListener("change", function(event) {

        const files = Array.from(event.target.files);

        files.forEach(file => {

            if (!file.type.startsWith("image/")) {
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {

                images.push({
                    src: e.target.result,
                    name: file.name
                });

                showPreview();
            };

            reader.readAsDataURL(file);
        });

        // Allow selecting the same file again
        imageInput.value = "";
    });


    // Show image previews
    function showPreview() {

        preview.innerHTML = "";

        images.forEach((image, index) => {

            const item = document.createElement("div");

            item.className = "image-item";

            item.innerHTML = `
                <img src="${image.src}" alt="${image.name}">

                <button
                    class="remove-btn"
                    onclick="removeImage(${index})"
                >
                    ×
                </button>
            `;

            preview.appendChild(item);
        });
    }


    // Remove image
    function removeImage(index) {

        images.splice(index, 1);

        showPreview();
    }


    // Generate PDF
    async function generatePDF() {

        const text =
            document.getElementById("content").value.trim();


        if (!text && images.length === 0) {

            alert("Please enter text or add at least one image.");

            return;
        }


        const pdf = new jsPDF();


        /*
         * ADD TEXT
         */

        if (text) {

            const pageWidth =
                pdf.internal.pageSize.getWidth();

            const pageHeight =
                pdf.internal.pageSize.getHeight();

            const margin = 20;

            const maxWidth =
                pageWidth - margin * 2;

            const lines =
                pdf.splitTextToSize(text, maxWidth);

            let y = margin;


            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(12);


            lines.forEach(line => {

                if (y > pageHeight - margin) {

                    pdf.addPage();

                    y = margin;
                }

                pdf.text(line, margin, y);

                y += 8;
            });
        }


        /*
         * ADD IMAGES
         */

        for (let i = 0; i < images.length; i++) {

            // Add a new page for every image
            pdf.addPage();


            const img = await loadImage(images[i].src);


            const pageWidth =
                pdf.internal.pageSize.getWidth();

            const pageHeight =
                pdf.internal.pageSize.getHeight();

            const margin = 10;


            const availableWidth =
                pageWidth - margin * 2;

            const availableHeight =
                pageHeight - margin * 2;


            // Original image size
            const imgWidth = img.width;
            const imgHeight = img.height;


            // Scale image to fit page
            const scale = Math.min(
                availableWidth / imgWidth,
                availableHeight / imgHeight
            );


            const finalWidth =
                imgWidth * scale;

            const finalHeight =
                imgHeight * scale;


            // Center image
            const x =
                (pageWidth - finalWidth) / 2;

            const y =
                (pageHeight - finalHeight) / 2;


            // Detect image format
            let format = "JPEG";

            if (images[i].src.includes("image/png")) {
                format = "PNG";
            }


            pdf.addImage(
                images[i].src,
                format,
                x,
                y,
                finalWidth,
                finalHeight
            );
        }


        /*
         * DOWNLOAD PDF
         */

        pdf.save("my-document.pdf");
    }


    // Load image before adding it to PDF
    function loadImage(src) {

        return new Promise((resolve, reject) => {

            const img = new Image();

            img.onload = () => resolve(img);

            img.onerror = reject;

            img.src = src;
        });
    }

</script>
